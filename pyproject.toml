[project]
name = "windjev"
version = "0.1.0"
description = "Confidence-aware decisions for developer workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "tingfeng347", email = "3152912378@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "typer>=0.15,<1",
    "typesafe-sdk>=0.7.1,<1",
]

[project.urls]
Repository = "https://github.com/tingfeng347/windjev"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "respx>=0.22,<1",
]

[project.scripts]
windjev = "windjev.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
